name: Build Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p duifene-gui

      - name: Package
        run: |
          mkdir -p dist/duifene-auto-linux-x86_64
          cp target/release/duifene-gui \
            dist/duifene-auto-linux-x86_64/duifene-auto
          tar -C dist -czf \
            duifene-auto-linux-x86_64.tar.gz \
            duifene-auto-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: duifene-auto-linux-x86_64
          path: duifene-auto-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p duifene-gui

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/duifene-gui.exe dist/duifene-auto.exe
          Compress-Archive `
            -Path dist/duifene-auto.exe `
            -DestinationPath duifene-auto-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: duifene-auto-windows-x86_64
          path: duifene-auto-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: duifene-auto-linux-x86_64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: duifene-auto-windows-x86_64
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
