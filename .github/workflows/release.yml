name: Build Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    name: Arch Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Arch Linux container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -lc '
              pacman -Syu --noconfirm --needed \
                base-devel \
                cargo \
                fontconfig \
                git \
                libx11 \
                libxkbcommon \
                libxkbcommon-x11 \
                openssl \
                pkgconf \
                wayland
              cargo build --release -p duifene-gui
            '

      - name: Package
        run: |
          package_root="dist/duifene-auto-linux-x86_64"
          mkdir -p "$package_root/usr/bin"
          mkdir -p "$package_root/usr/share/applications"
          mkdir -p "$package_root/usr/share/icons/hicolor/256x256/apps"
          cp target/release/duifene-gui "$package_root/usr/bin/duifene-auto"
          cp packaging/linux/duifene-auto.desktop "$package_root/usr/share/applications/duifene-auto.desktop"
          icon_path="$(find target/release/build/duifene-gui-*/out -name icon.png -print -quit)"
          test -n "$icon_path"
          cp "$icon_path" "$package_root/usr/share/icons/hicolor/256x256/apps/duifene-auto.png"
          tar -C dist -czf \
            duifene-auto-linux-x86_64.tar.gz \
            duifene-auto-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: duifene-auto-linux-x86_64
          path: duifene-auto-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p duifene-gui

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/duifene-gui.exe dist/duifene-auto.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: duifene-auto-windows-x86_64
          path: dist/duifene-auto.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: duifene-auto-linux-x86_64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: duifene-auto-windows-x86_64
          path: dist/windows-artifact

      - name: Package Windows release
        run: |
          zip -j dist/duifene-auto-windows-x86_64.zip \
            dist/windows-artifact/duifene-auto.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
